<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Personal Shopper Assistant" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
  {% block head_extra %}{% endblock %}
</head>
{% set active_search = (search_results | default([]) | length) > 0 %}
<body class="{% if active_search %}search-active{% else %}search-idle{% endif %}">
  <div class="page-gradient"></div>
  <header class="top-nav">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="brand-mark">PS</span>
      <span class="brand-copy">Personal Shopper</span>
    </a>
  </header>

  <main class="app-shell">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
